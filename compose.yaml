name: zaimedia-local

services:
  app:
    build:
      context: .
      target: app
    environment:
      APP_NAME: Zaimedia
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Run python scripts/setup-local.py first}
      APP_URL: ${APP_URL:-http://127.0.0.1:18090}
      FRONTEND_URL: ${APP_URL:-http://127.0.0.1:18090}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-zaimedia}
      DB_USERNAME: ${DB_USERNAME:-zaimedia}
      DB_PASSWORD: ${DB_PASSWORD:?Set a private DB_PASSWORD}
      CHECKOUT_DEMO_MODE: ${CHECKOUT_DEMO_MODE:-false}
      CHECKOUT_AUTO_PAID: ${CHECKOUT_AUTO_PAID:-false}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-60}
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
      CACHE_STORE: file
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: log
      BROADCAST_DRIVER: log
      FILESYSTEM_DISK: local
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
      - /var/www/html/bootstrap/cache:size=16m,uid=33,gid=33,mode=775
    volumes:
      - app-storage:/var/www/html/storage
      - uploads:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "zaimedia-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${APP_PORT:-18090}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
    volumes:
      - type: volume
        source: uploads
        target: /var/www/html/public/uploads
        read_only: true
        volume:
          nocopy: true
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  db:
    image: mysql:8.4@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
    command: ["--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-zaimedia}
      MYSQL_USER: ${DB_USERNAME:-zaimedia}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set a private DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a private MYSQL_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h127.0.0.1 -u\"$${MYSQL_USER}\" -D\"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 512m

volumes:
  app-storage:
  uploads:
  db-data:
