worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    proxy_temp_path /tmp/proxy_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream zaimedia_api {
        zone zaimedia_api 64k;
        server app:9000 resolve;
    }

    server {
        listen 8080;
        root /srv/zaimedia;
        index index.html;
        client_max_body_size 55m;
        add_header X-Content-Type-Options nosniff always;

        location ~ /\. { deny all; }
        location ~* \.(?:php|phtml|phar|sql|zip)$ { return 404; }
        location ~* ^/(?:laravel-api|vue-frontend|storage|vendor|node_modules|docker|tests|scripts)(?:/|$) { return 404; }
        location ~* ^/(?:Dockerfile|compose\.yaml|composer\.(?:json|lock)|package(?:-lock)?\.json|README\.md)$ { return 404; }

        location /api/ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass zaimedia_api;
            fastcgi_read_timeout 60s;
            fastcgi_buffering off;
        }

        location /uploads/ {
            root /var/www/html/public;
            if ($uri !~* \.(?:png|jpe?g|webp|gif)$) { return 404; }
            try_files $uri =404;
        }

        location /assets/ { try_files $uri =404; }

        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/ /index.html;
        }
    }
}
